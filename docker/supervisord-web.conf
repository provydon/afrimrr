[supervisord]
nodaemon=true
user=appuser
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[group:web]
programs=frankenphp
priority=10

[program:frankenphp]
process_name=%(program_name)s
; --log-level is REQUIRED. Without it, octane:start parses FrankenPHP's stderr
; and extracts Caddy's `msg` key; Laravel's Monolog logs are keyed `message`, so
; Octane prints the literal "unknown error" and drops the real log content
; (StartFrankenPhpCommand::writeServerOutput). With --log-level set, Octane passes
; the raw stderr straight through, so your real Laravel logs reach the platform's
; log explorer, and Caddy only logs at/above this level. Override via OCTANE_LOG_LEVEL
; (DEBUG|INFO|WARN|ERROR); wrapped in `sh -c` so the env var expands.
command=sh -c "exec php /app/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000 --admin-port=2019 --workers=1 --max-requests=500 --log-level=${OCTANE_LOG_LEVEL:-ERROR}"
autostart=true
autorestart=true
startsecs=3
priority=10
user=appuser
redirect_stderr=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
